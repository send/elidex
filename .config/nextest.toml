[profile.default]
# Fail fast on first failure in local dev
fail-fast = true
# Use all available CPUs for test execution
test-threads = "num-cpus"
# Liveness guard owned by the runner, never a verdict inside a test: a test that
# runs past 8 x 60 s is killed and NAMED.  Harness waits are unbounded by design
# (no wall clock decides a correctness verdict, `#11-sw-respond-with-gc-test-wallclock-timeout`),
# so without this a hang would only end at the CI job's timeout, naming no test.
# Measured 2026-11-06: slowest single test 64.8 s in CI (main run 42072724049,
# windows/ubuntu `elidex-dom-api element::inheritance::tests::caps_walk_at_max_ancestor_depth`),
# 209.9 s in a local `mise run ci` at load average ~100.  480 s is 7.4x / 2.3x those.
# CI runs this profile (`cargo nextest run` in ci.yml passes no `--profile`);
# `[profile.ci]` does not override `slow-timeout`.
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.ci]
# CI: run all tests even if some fail
fail-fast = false
