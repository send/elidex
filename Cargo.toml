publish = false

[workspace.dependencies]
# Dependency policy (PM 869 / 980): a requirement here is the semver line the
# code is written against, not a security floor; it is not measured as a
# minimum (no minimal-versions check). Cargo.lock is canonical for what is
# built.
# The advisory gate is `cargo deny check advisories`: the CI `deny` job and
# the weekly `audit.yml` (a failure on main, push CI or scheduled run, has no
# named owner or route yet: `#11-ci-scheduled-failure-unrouted`; until then
# the PM checks `gh run list --branch main` each pass).
# A RUSTSEC fix whose fixed version is inside the requirement arrives as a
# lock-only PR: a Dependabot security update (enabled 2026-11-21, PM 871) or
# by hand with `cargo update -p <crate> --precise <version>`. When the fix
# exists only on a newer line (a new 0.x minor or major), the requirement
# moves to that line.
anyhow = "1"
base64 = "0.23"
bitflags = "2"
arboard = "3"
cssparser = "0.37"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1"
hecs = "0.11"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
# `rustls` (not `rustls-no-provider`): selects reqwest's bundled aws-lc-rs CryptoProvider so the
# crawler's TLS rides the same single crypto C lib as elidex-net + WebCrypto (rationale + the
# provider-resolution guard: `elidex-crawler` `crawler::tests::reqwest_client_resolves_crypto_provider`).
# This feature weakly references `quinn?/rustls-aws-lc-rs`, so Cargo records
# quinn/quinn-proto/quinn-udp/lru-slab in Cargo.lock — they are NEVER compiled (quinn builds only
# under reqwest's unused `http3` feature; `cargo tree -i quinn` is empty).
reqwest = { version = "0.13", default-features = false, features = ["gzip", "brotli", "rustls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
phf = "0.14"
phf_codegen = "0.14"
fontdb = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustybuzz = "0.20"
bytes = "1"
cookie = "0.18"
crossbeam-channel = "0.5"
psl = "2"
http = "1"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws_lc_rs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes = "0.9"
aes-kw = "0.3"
cbc = "0.2"
ghash = "0.6"
subtle = "2"
getrandom = "0.4"
# RUSTSEC-2026-0387 (crypto-bigint timing variability) is fixed only in
# crypto-bigint >= 0.7.6, which is reachable only through the 0.14 EC line
# (elliptic-curve 0.14 requires crypto-bigint ^0.7); the 0.13 line pins 0.5.
# crypto-bigint >= 0.7.6 is guaranteed by Cargo.lock and checked by `cargo deny`
# like every other advisory (see the policy block at the top); elliptic-curve
# 0.14 / primefield require only ^0.7.5.
# Elliptic-curve stack for WebCrypto ECDSA / ECDH (PR-4).  The stable 0.14 EC
# line (crypto-bigint 0.7 generation); ECDSA is driven via
# `sign_prehash` / `verify_prehash` so our `sha2 0.11` digest stays decoupled
# from ecdsa's digest generation.  `pkcs8` enables both PKCS#8 (private) and
# SPKI (public) DER; `arithmetic` is required for ECDH scalar multiplication.
elliptic-curve = { version = "0.14", features = ["arithmetic", "sec1", "ecdh", "pkcs8"] }
ecdsa = "0.17"
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8", "arithmetic"] }
p384 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8", "arithmetic"] }
p521 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8", "arithmetic"] }
# RSA stack for WebCrypto RSASSA-PKCS1-v1_5 / RSA-PSS (PR-5a).  The stable
# 0.9 line (digest 0.10 / rand_core 0.6 generation; num-bigint-dig is the
# new transitive).  `std` only (no `pem`: WebCrypto is DER-only); keygen RNG
# is passed explicitly (no `getrandom`).  Signing uses the prehash
# `RsaPrivateKey::sign` / `RsaPublicKey::verify`, so the message digest stays on
# hash.rs (sha2 0.11); the digest *types* below supply only the `AssociatedOid` markers for the
# PKCS#1 v1.5 DigestInfo prefix + the PSS MGF1 hash.
# Keygen termination floor/exponent-cap derive from rsa 0.9 internals: any version
# change triggers `#11-rsa-keygen-search-budget` (see rng.rs).
rsa = { version = "0.9", default-features = false, features = ["std"] }
# sha1 / sha2 0.10 (the rsa 0.9 digest generation) — `oid` for the
# `AssociatedOid` marker types only; aliased so they coexist with the 0.11
# sha1 / sha2 hash.rs uses for the actual digest computation.
sha1-oid = { package = "sha1", version = "0.10", features = ["oid"] }
sha2-oid = { package = "sha2", version = "0.10", features = ["oid"] }
# rand_core 0.6 (the rsa 0.9 generation) — direct dep for the VM entropy-seam
# adapters in `rng.rs`: `ClosureRng` = rand_core 0.6 for RSA key generation and
# signing (with the error latch); `TryClosureRng` = rand_core 0.10 via
# `elliptic_curve::rand_core` for EC `NonZeroScalar::try_generate_from_rng`.
# When rsa 0.10 is stable, `ClosureRng` moves to the rand_core 0.10 infallible
# traits (latch kept; `TryClosureRng` stays for EC) and this dependency is
# removed (`#11-closure-rng-rand-core-06-bridge`).
rand_core = "0.6"
# aws-lc-rs (AWS-LC, a BoringSSL fork) — the workspace's **single crypto C library**, shared by
# the rustls TLS stack (the `CryptoProvider` for elidex-net + reqwest + tungstenite; replaces the
# former `ring` provider) AND WebCrypto §22 RSA-OAEP encrypt / decrypt / wrapKey / unwrapKey (PR-5b).
# RSA-OAEP runs here because the pure-Rust `rsa` crate carries RUSTSEC-2023-0071 (Marvin) on its
# private-key ops AND models the OAEP `label` as a UTF-8 `String` (so it cannot represent WebCrypto's
# arbitrary `BufferSource` label) — aws-lc-rs gives both constant-time decryption and a byte-slice
# label (`Option<&[u8]>`), so the whole RSA-OAEP op-set runs here while the signing / key-management
# families stay on `rsa` 0.9.  The non-FIPS backend (`aws-lc-sys`, built via cmake/cc) is
# constant-time; no `fips` feature.  License Apache-2.0/ISC.
aws-lc-rs = "1.13"
webpki-roots = "1"
