# rusqlite 0.41 needs rustc 1.89 (`rust-toolchain.toml`).
#
# Default features are off: the defaults are `cache` (no consumer calls
# `prepare_cached`) and `ffi-sqlite-wasm-rs`; no consumer targets wasm, and
# that default would build a second, separately versioned SQLite
# (sqlite-wasm-rs). Add a feature here when a consumer uses it.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"
vello = "0.9"
wgpu = "29"
winit = "0.30"
pollster = "0.4"
tiny-skia = "0.12"
accesskit = "0.24"
accesskit_winit = "0.33"
# wasmtime 50 needs rustc 1.97 (`rust-toolchain.toml`).
#
# Default features are off: each feature below is one elidex-wasm-runtime uses,
# and anything wasmtime adds to its defaults stays out until something here
# needs it. (The default `cache` feature pulled in zstd for an on-disk compile
# cache elidex never configures.)
# - `runtime`, `std`: `Engine` / `Store` / `Module` / `Instance` / `Linker`.
# - `cranelift`: `Module::new` compiles at run time; without a compiler it fails.
# - `parallel-compilation`: that compile runs its functions on rayon's global
#   pool rather than on one thread.
# - `gc`: the `ExternRef` host API (`engine_conv.rs`, `handle.rs`); it also
#   keeps the Wasm GC and exception-handling proposals on.
# - `gc-copying`: a GC engine needs a collector; this is the one
#   `Collector::Auto` picked under the old defaults.
# - `threads`: keeps the threads proposal (atomics, shared memory) on, so
#   modules built with atomics still compile.
# - `backtrace`, `demangle`: a trap's `RuntimeError` message carries the
#   wasm backtrace with demangled names, as before.
wasmtime = { version = "50", default-features = false, features = [
    "runtime",
    "std",
    "cranelift",
    "parallel-compilation",
    "gc",
    "gc-copying",
    "threads",
    "backtrace",
    "demangle",
] }
wat = "1"
static_assertions = "1"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
regex = "1"
regress = { version = "0.11", features = ["utf16"] }
criterion = { version = "0.8", default-features = false }
elidex-wpt = { path = "crates/tools/elidex-wpt" }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Nursery lint, enabled on its own: a call that takes `&mut` inside
# `debug_assert!` does not run in release builds (side effects through `&self`
# or interior mutability are not caught). On main before #568 it flagged 3 sites: one
# real defect (`begin_detached_fragment` appended the root inside the assert,
# so release builds never appended it) and two read-only checks that went
# through a `&mut` accessor (rewritten to read through `&self`).
debug_assert_with_mut_call = "warn"
# Allow assert_eq! on f32 in tests (exact values from deterministic computations)
float_cmp = "allow"
# assert!(x.is_empty()) is the idiomatic form; the lint's suggestion (`[] as [T; 0]`) reads worse and does not type-check under --fix
assert_is_empty = "allow"
# Allow common patterns
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
