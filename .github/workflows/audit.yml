name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The pinned toolchain (rust-toolchain.toml), the one `cargo audit` runs
      # under; see the `check` job in ci.yml.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit
