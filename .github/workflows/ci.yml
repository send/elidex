name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - 'mise.toml'
              - '.github/workflows/**'
            config:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  check:
    name: Check, Test, Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-core fonts-liberation

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (nextest, no doc-tests)
        run: cargo nextest run --workspace --all-features

      - name: Run doc-tests
        run: cargo test --workspace --doc --all-features

  doc:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licenses & Vulnerabilities
    needs: changes
    if: needs.changes.outputs.config == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and vulnerabilities
        run: cargo deny check

  # (Commit ids in this comment block are PR #510 branch commits; after the squash
  # merge, `git fetch origin pull/510/head` and resolve them against `FETCH_HEAD`.)
  # Deliberately UNGATED — no `needs: changes`, no `if:`. The three gated jobs above
  # are filtered because each pays for a Rust toolchain; the wires need none (the
  # layering wires call no cargo, rustc or python, and the self-test wire needs
  # only the `python3` already on `ubuntu-latest`), so a filter would buy nothing and cost the
  # one property the wires exist for. Gating them would mean listing BOTH
  # `.claude/tools/**` (the wires and `layout-box-reader-allowlist.tsv`) and
  # `scripts/**` (this job's entry point) in a filter — i.e. the tamper path of an
  # allowlist gate would itself be an allowlist entry someone must remember to keep
  # current, and a PR editing only `layout-box-reader-allowlist.tsv` would skip the
  # job that reads it. Running unconditionally removes that failure mode by
  # construction, for these wires and for any wire added later whose path coverage
  # nobody re-derives.
  #
  # THE BUDGET. The self-test wire's `--self-test --mutants` grows with every
  # review round that adds controls or mutants, so this job's run time is a
  # budget against `timeout-minutes` below, not a constant. ONE figure is kept
  # here, and it is the job itself on the runner -- no local host, no scaling:
  # at `12124f83` (942 controls / 586 mutants) the whole `Layering trip-wires`
  # job took 170 s, checkout included (run 36339986057), ~3.5x against the 10
  # minutes. Re-measure from a run, not from this line:
  #   gh run view <run-id> --json jobs --jq '.jobs[]|select(.name=="Layering trip-wires")|[.startedAt,.completedAt]'
  # The local figures this block used to carry are NOT restated: they had
  # different subjects (one wire, the whole script, unrecorded) and were read
  # as one series, and every correction of one of them exposed another (PR
  # #510, four STOP-CLEAN attestations in a row). They are history, at
  # `git show d7f12732:.github/workflows/ci.yml` (this block), and the growth
  # driver is the plan's §8 entry "The always-run wire's cost grows with
  # REVIEW ROUNDS, not with the program". A second heavy wire
  # (`claim-provenance-trip-wire.sh`, the `stale-claim-detector` lane) will run
  # in this same job; when it lands, re-measure the job on the runner. The
  # plan's §1 carries the merge obligation on `REQUIRED_WIRES`.
  #
  # What this does and does not buy: it makes a drifted allowlist RED on the PR. It
  # does not block the merge — the `main-protection` ruleset carries no
  # required-status-check rule, so merging still rests on the CLAUDE.md convention of
  # eyeballing CI before squashing.
  trip-wires:
    name: Layering trip-wires
    # 10 minutes. The headroom multiple and the measurement behind it live in the
    # comment above and are NOT restated here: this line carried its own copy and
    # went stale the moment that block was re-measured -- the same two-live-copies
    # defect PR #510 R30 removed from CLAUDE.md, repeated inside the file that is
    # supposed to be the single home. One home for a number that moves.
    # ⚠ And it moves one way, because every round's new controls and mutants land
    # in an always-run job: that is a budget, not a constant. When it nears 2x,
    # split the wire or re-derive the timeout deliberately -- do not discover it
    # when a runner cancels a green job, which is exactly what the 2 this
    # replaced did at 211 s. The RULE is here; the figure it is read against is
    # the one runner measurement above, re-measured rather than extended into a
    # series (a series was kept, here and above, and went stale both times).
    # This 10 is the deliberate re-derivation
    # that rule asked for, made at R32 (its derivation is in the history the
    # comment above points to).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The same script `mise run trip-wires` runs, so the local gate and CI
      # cannot diverge. No toolchain step: the wires are grep-only except
      # `plan-memo-umbrella-selftest-trip-wire.sh`, which needs `python3`
      # (stdlib only, no packages) — present on `ubuntu-latest`; that wire
      # FAILs rather than skips if the interpreter is absent.
      - name: Run layering trip-wires
        run: bash scripts/trip-wires.sh
