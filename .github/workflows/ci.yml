name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              # No clippy config is tracked (ADR #36: no MSRV during development);
              # one added at the root (either spelling clippy reads) changes what
              # clippy checks, so it runs the jobs. Per-crate ones fall under crates/**.
              - 'clippy.toml'
              - '.clippy.toml'
              - 'mise.toml'
              - '.github/workflows/**'
              - '.github/actions/**'
            config:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - '.github/actions/**'

  check:
    name: Check, Test, Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pinned-rust-toolchain

      - name: Install fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-core fonts-liberation

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (nextest, no doc-tests)
        run: cargo nextest run --workspace --all-features

      - name: Run doc-tests
        run: cargo test --workspace --doc --all-features

  doc:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pinned-rust-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licenses & Vulnerabilities
    needs: changes
    if: needs.changes.outputs.config == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pinned-rust-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and vulnerabilities
        run: cargo deny check

  # Deliberately UNGATED — no `needs: changes`, no `if:`. The three gated jobs above
  # are filtered because each pays for a Rust toolchain; the wires need NOTHING
  # INSTALLED — no language runtime, no package manager, no cache, no network —
  # so a filter would buy nothing and cost the one property the wires exist for.
  # ⚠ THE PROPERTY IS "NOTHING TO INSTALL", NOT A LIST OF TOOLS. Two wordings
  # have now been retired here for being enumerations narrower than the truth:
  # "the wires are grep-only" (they call `git` constantly) and "the shell, `git`
  # and `grep`" (they call a good deal more than that, and no third list is
  # offered here). Both were false in the same shape, and the second was
  # written while retiring the first. What is checkable, and what the gating
  # decision rests on, is that this job has NO SETUP STEP — one `uses:`, the
  # checkout:
  #   yq '.jobs["trip-wires"].steps[].uses' .github/workflows/ci.yml
  #   # or: sed -n '/^  trip-wires:/,/^  [a-z]/p' .github/workflows/ci.yml | grep -c 'uses:'
  # ⚠ DELIBERATELY NO RUNTIME FIGURE EITHER. This said "~1s for the whole set"
  # until a wire grew fixture self-tests and the number stopped being true, and
  # then carried a cross-machine RATIO ("two to three times this checkout's")
  # whose baseline was stated nowhere — the same defect one level down, inside
  # the block whose thesis is that such figures do not belong here. The
  # `timeout-minutes` below is the one number with a consequence; it is
  # measured from a run of this job on the runner (the job's comment says how),
  # not tracked here. The time that is spent goes
  # to the wires' own fixture self-tests rather than to the tree they scan, so
  # it tracks the number of controls, not the size of the repo.
  # Gating them would mean listing BOTH
  # `.claude/tools/**` (the wires and `layout-box-reader-allowlist.tsv`) and
  # `scripts/**` (this job's entry point) in a filter — i.e. the tamper path of an
  # allowlist gate would itself be an allowlist entry someone must remember to keep
  # current, and a PR editing only `layout-box-reader-allowlist.tsv` would skip the
  # job that reads it. Running unconditionally removes that failure mode by
  # construction, for these wires and for any wire added later whose path coverage
  # nobody re-derives.
  #
  # What this does and does not buy: it makes a drifted allowlist RED on the PR. It
  # does not block the merge — the `main-protection` ruleset carries no
  # required-status-check rule, so merging still rests on the CLAUDE.md convention of
  # eyeballing CI before squashing.
  trip-wires:
    name: Layering trip-wires
    # The K2 wire's fixture self-tests are the first thing in this job whose
    # cost is a large multiple of the scan it guards.
    # ⚠ NO FIGURES HERE, for the reason the block above gives — and an earlier
    # revision of THIS comment broke that rule twenty lines below it, quoting a
    # before/after and a runner ratio whose baseline machine was named nowhere.
    # Three reviewers measured the same checkout and got materially different
    # numbers, so no local host measures this budget.
    # THE METHOD: this job itself, measured from a run on the runner, with no
    # local host and no scaling:
    #   gh run view <run-id> --json jobs --jq '.jobs[]|select(.name=="Layering trip-wires")|[.startedAt,.completedAt]'
    # ⚠ THE RULE, so the next person does not have to rediscover it: a PR that
    # adds fixture self-tests re-measures this job that way, in the same PR.
    # Leaving the budget while the job grows is how an always-run gate starts
    # failing for time instead of for what it asserts.
    # NO FIGURE IS KEPT HERE: the measurement and its history have one home,
    # the open implementation record of
    # docs/plans/2026-09-citation-hygiene-k2-fgit-hermetic.md (its §13 names
    # the file).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The same script `mise run trip-wires` runs, so the local gate and CI
      # cannot diverge. No setup step — nothing to install; see the block above
      # for why this is stated as a property and not as a list of tools.
      - name: Run layering trip-wires
        run: bash scripts/trip-wires.sh

  # Deliberately UNGATED, like `trip-wires` above -- no `needs:`, no `if:`, no
  # path-filter entry. This job runs every tracked Python suite
  # (`git ls-files ':(glob)**/test_*.py'`) through `scripts/python-suites.sh`, the
  # same script `mise run tools-test` runs. A filter would make the suites' tamper
  # path an allowlist entry someone must keep current: a PR editing only a suite's
  # input would skip the job that reads it. So every pull request targeting `main`
  # runs it, a Dependabot bump included. The set, the complement checks, the
  # offline regime and the interpreter floor belong to the script (its header is
  # the procedure); this job adds only the interpreter.
  #
  # The job boundary, as three properties (rule source: the `trip-wires` comment
  # of PR #501):
  #   - `trip-wires` declares no interpreter: it has no setup step, so a wire runs
  #     on what the runner image ships (shell, git and the POSIX text utilities).
  #   - `tools` declares its interpreter: `actions/setup-python`, on every leg.
  #   - A check that needs a language runtime (one whose result depends on the
  #     runtime's version: python3, node, ...) belongs to the job that declares
  #     one. A Python check enters here as a tracked `test_*.py` -- a thin wrapper
  #     if it is a command-shaped self-test (the contract is in the script header).
  #
  # The legs: "3.9" is the interpreter floor and the only measurement of it;
  # "3.x" is the newest the action resolves, so a newest-runtime break shows on the
  # PR that meets it. Both legs run the whole set, with no per-leg branching.
  #
  # Timeout: a PR that adds suite cost re-derives `timeout-minutes` in the same PR
  # from its own run of this job (the slower leg bounds the job), e.g.
  #   gh run view <run-id> --json jobs \
  #     --jq '.jobs[] | select(.name | startswith("Python suites")) | [.name, .startedAt, .completedAt]'
  # PR #549 measured this job before the plan-memo checker's self-test joined
  # it: on its run (run 40168647140) the slower leg ("3.9") took 25 s end to end.
  # PR #510 then added that self-test and its mutation proof and re-derived the
  # value below from its own run 40162851960 (slower leg = "3.9"): about 4x that
  # leg -- the margin PR #510's R32 re-derivation restored for the retired
  # trip-wire. The checker's plan asks for the next re-derivation when a run
  # measures under 2x (its §8 entry "The always-run self-test's cost grows with
  # REVIEW ROUNDS, not with the program").
  #
  # What this does and does not buy: a failing suite is RED on the PR. It does not
  # block the merge -- the `main-protection` ruleset carries no
  # required-status-check rule -- so merging still rests on the CLAUDE.md
  # convention of eyeballing CI before squashing.
  tools:
    name: Python suites
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]
    # Pinned, not `ubuntu-latest`: the "3.9" leg needs an image setup-python serves
    # 3.9 for. Re-check when Slice B raises the floor or ubuntu-24.04 retires.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The same script `mise run tools-test` runs, so the local gate and CI
      # cannot diverge. It asserts the floor and echoes `python3 -VV` first.
      - name: Run the Python suites
        run: bash scripts/python-suites.sh
