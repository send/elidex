name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - 'mise.toml'
              - '.github/workflows/**'
            config:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  check:
    name: Check, Test, Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-core fonts-liberation

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (nextest, no doc-tests)
        run: cargo nextest run --workspace --all-features

      - name: Run doc-tests
        run: cargo test --workspace --doc --all-features

  doc:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licenses & Vulnerabilities
    needs: changes
    if: needs.changes.outputs.config == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and vulnerabilities
        run: cargo deny check

  # Deliberately UNGATED — no `needs: changes`, no `if:`. The three gated jobs above
  # are filtered because each pays for a Rust toolchain; the wires need none (~1s for
  # the whole set, no toolchain, no cache), so a filter would buy nothing and cost the
  # one property the wires exist for. Gating them would mean listing BOTH
  # `.claude/tools/**` (the wires and `layout-box-reader-allowlist.tsv`) and
  # `scripts/**` (this job's entry point) in a filter — i.e. the tamper path of an
  # allowlist gate would itself be an allowlist entry someone must remember to keep
  # current, and a PR editing only `layout-box-reader-allowlist.tsv` would skip the
  # job that reads it. Running unconditionally removes that failure mode by
  # construction, for these wires and for any wire added later whose path coverage
  # nobody re-derives.
  #
  # What this does and does not buy: it makes a drifted allowlist RED on the PR. It
  # does not block the merge — the `main-protection` ruleset carries no
  # required-status-check rule, so merging still rests on the CLAUDE.md convention of
  # eyeballing CI before squashing.
  trip-wires:
    name: Layering trip-wires
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The same script `mise run trip-wires` runs, so the local gate and CI
      # cannot diverge. No toolchain step: the wires are grep-only.
      - name: Run layering trip-wires
        run: bash scripts/trip-wires.sh
