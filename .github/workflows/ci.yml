name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - 'mise.toml'
              - '.github/workflows/**'
            config:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  check:
    name: Check, Test, Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-core fonts-liberation

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests (nextest, no doc-tests)
        run: cargo nextest run --workspace --all-features

      - name: Run doc-tests
        run: cargo test --workspace --doc --all-features

  doc:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licenses & Vulnerabilities
    needs: changes
    if: needs.changes.outputs.config == 'true' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and vulnerabilities
        run: cargo deny check

  # Deliberately UNGATED — no `needs: changes`, no `if:`. The three gated jobs above
  # are filtered because each pays for a Rust toolchain; the wires need none (the layering
  # wires ~1s; the self-test wire's mutant run is plain python3 -- measured at
  # 29dc1eb7: local 49 s / Codex's runner 211 s, all of it ONE mutant whose call
  # counter watched the wrong module and was killed only by a quadratic wall-clock
  # ratio; after the PR #510 R12 fix `--self-test --mutants` was 4.2 s locally and
  # the whole `scripts/trip-wires.sh` 5.8 s, so the same 4.3x-slower runner was
  # ~25 s. ⚠ PR #510 R27 raised it, because R27 answered "is this program
  # linear?" with a corpus GENERATED from the grammar instead of another
  # hand-written shape, and that sweep runs once in `--self-test` plus once per
  # mutant naming it. PR #510 R29 raised it again, by
  # about a second, for the exhaustive id-scan corpus and two new sweeps.
  # MEASURED, WITH THE CONDITION STATED, because the first R27 figure here was
  # neither: **~13.7 s** (three runs, 13.68 / 14.36 / 14.42, `/usr/bin/time -p`,
  # on a `git clone --local` of the commit being described, nothing else of this
  # project running). ⚠ THE BASE WAS RE-MEASURED IN THE SAME SESSION, on the
  # same clone, minutes apart: the branch's parent ran 12.23 / 12.89 / 13.21
  # against the 11.8 s recorded for it at R27, so ~0.4 s of the difference above
  # is the host and not this branch. Quote the pair, never the later number
  # alone. The same 4.3x runner is therefore ~59 s against the
  # `timeout-minutes: 5` below -- ~5.1x headroom.
  # ⚠ THE CONDITION IS PART OF THE NUMBER: the same script measured 26.2 / 27.2 s
  # in a busy worktree minutes earlier, 2.2x this, and that inflated figure was
  # committed here for one round as "2.6x headroom". A timing in this comment
  # without a stated condition is not reproducible and will drift with whatever
  # the machine happens to be doing; re-measure on a clean clone. That sweep is
  # what caught two defects in R27 before the reviewer's shapes were written, so
  # the cost buys the property; no Rust
  # toolchain, no cache; the self-test wire needs only the `python3` already on
  # `ubuntu-latest`), so a filter would buy nothing and cost the
  # one property the wires exist for. Gating them would mean listing BOTH
  # `.claude/tools/**` (the wires and `layout-box-reader-allowlist.tsv`) and
  # `scripts/**` (this job's entry point) in a filter — i.e. the tamper path of an
  # allowlist gate would itself be an allowlist entry someone must remember to keep
  # current, and a PR editing only `layout-box-reader-allowlist.tsv` would skip the
  # job that reads it. Running unconditionally removes that failure mode by
  # construction, for these wires and for any wire added later whose path coverage
  # nobody re-derives.
  #
  # What this does and does not buy: it makes a drifted allowlist RED on the PR. It
  # does not block the merge — the `main-protection` ruleset carries no
  # required-status-check rule, so merging still rests on the CLAUDE.md convention of
  # eyeballing CI before squashing.
  trip-wires:
    name: Layering trip-wires
    # 5 = ~5.9x the extrapolated worst case since PR #510 R27's generated growth
    # sweep (it was ~10x before it; measurement AND its condition in the comment
    # above -- a figure here without the condition drifted 2.2x once already); the
    # 2 it replaced cancelled an otherwise-green job at 211 s on a slower runner.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The same script `mise run trip-wires` runs, so the local gate and CI
      # cannot diverge. No toolchain step: the wires are grep-only except
      # `plan-memo-umbrella-selftest-trip-wire.sh`, which needs `python3`
      # (stdlib only, no packages) — present on `ubuntu-latest`; that wire
      # FAILs rather than skips if the interpreter is absent.
      - name: Run layering trip-wires
        run: bash scripts/trip-wires.sh
