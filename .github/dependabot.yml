version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    # The RustCrypto stack is now split across two generations (see the
    # comments on those entries in Cargo.toml): the EC stack (elliptic-curve
    # 0.14 / ecdsa 0.17 / p256·p384·p521 0.14) is on rand_core 0.10 and tracks
    # upstream normally (no hold), while `rsa` 0.9 is still on rand_core 0.6
    # (+ the test-only rand_chacha 0.3). Those three move only together: bumping
    # `rand_core` / `rand_chacha` alone would split RSA from its RNG traits, and
    # `rsa` has no stable release on rand_core 0.10 yet. Hold them on their
    # current 0.x line; patch updates still flow. Removal trigger: rsa 0.10
    # stable, which retires the 0.6 `ClosureRng` bridge (defer slot
    # `#11-closure-rng-rand-core-06-bridge`) and with it these three entries.
    ignore:
      - dependency-name: "rsa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
